<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <!-- Background Shield Clip -->
  <defs>
    <clipPath id="shieldClip">
      <path d="M 60 20 L 340 20 C 340 20 360 220 320 320 C 280 390 200 440 200 440 C 200 440 120 390 80 320 C 40 220 60 20 60 20 Z" />
    </clipPath>
  </defs>

  <!-- Outer Shield Border -->
  <path d="M 52 14 L 348 14 C 348 14 370 224 328 328 C 285 402 200 454 200 454 C 200 454 115 402 72 328 C 30 224 52 14 52 14 Z" fill="#d9251d" />
  <path d="M 58 20 L 342 20 C 342 20 362 222 322 322 C 281 392 200 442 200 442 C 200 442 119 392 78 322 C 38 222 58 20 58 20 Z" fill="#ffffff" />

  <!-- Inner Clipped Content -->
  <g clip-path="url(#shieldClip)">
    <!-- Yellow Base Background -->
    <rect x="0" y="0" width="400" height="480" fill="#facc15" />

    <!-- Green Sunburst Rays radiating from Lingga (x=200, y=180) -->
    <!-- 17 Sunburst segments -->
    <polygon points="200,180 50,20 80,20" fill="#22c55e" />
    <polygon points="200,180 110,20 140,20" fill="#22c55e" />
    <polygon points="200,180 170,20 200,20" fill="#22c55e" />
    <polygon points="200,180 200,20 230,20" fill="#22c55e" />
    <polygon points="200,180 260,20 290,20" fill="#22c55e" />
    <polygon points="200,180 320,20 350,20" fill="#22c55e" />
    
    <polygon points="200,180 360,70 360,105" fill="#22c55e" />
    <polygon points="200,180 360,140 360,175" fill="#22c55e" />
    <polygon points="200,180 360,210 350,245" fill="#22c55e" />
    <polygon points="200,180 340,270 320,300" fill="#22c55e" />

    <polygon points="200,180 40,70 40,105" fill="#22c55e" />
    <polygon points="200,180 40,140 40,175" fill="#22c55e" />
    <polygon points="200,180 40,210 50,245" fill="#22c55e" />
    <polygon points="200,180 60,270 80,300" fill="#22c55e" />

    <!-- Black Lower Ground of Shield -->
    <path d="M 40 265 L 360 265 L 360 480 L 40 480 Z" fill="#18181b" />

    <!-- 3 Zigzag River Waves in Lower Section (Sungai Cimanuk) -->
    <!-- Wave 1 -->
    <path d="M 60 295 L 90 310 L 120 290 L 150 315 L 180 295 L 210 320 L 240 295 L 270 315 L 300 290 L 330 310 L 340 300 L 330 290 L 300 275 L 270 300 L 240 280 L 210 305 L 180 280 L 150 300 L 120 275 L 90 295 Z" fill="#ffffff" />
    <!-- Wave 2 -->
    <path d="M 60 345 L 90 360 L 120 340 L 150 365 L 180 345 L 210 370 L 240 345 L 270 365 L 300 340 L 330 360 L 340 350 L 330 340 L 300 325 L 270 350 L 240 330 L 210 355 L 180 330 L 150 350 L 120 325 L 90 345 Z" fill="#ffffff" />
    <!-- Wave 3 -->
    <path d="M 80 395 L 110 410 L 140 390 L 170 415 L 200 395 L 230 420 L 260 395 L 290 415 L 320 390 L 310 375 L 290 400 L 260 380 L 230 405 L 200 380 L 170 400 L 140 375 L 110 395 Z" fill="#ffffff" />

    <!-- Monumen Lingga (Sumedang) -->
    <!-- Stone Base -->
    <polygon points="90,265 130,200 270,200 310,265" fill="#f8fafc" stroke="#18181b" stroke-width="4" />
    <!-- Stone Pattern on Base -->
    <g fill="#94a3b8" opacity="0.6">
      <circle cx="120" cy="245" r="7" /><circle cx="138" cy="248" r="8" /><circle cx="156" cy="246" r="7" /><circle cx="174" cy="250" r="9" />
      <circle cx="130" cy="230" r="8" /><circle cx="148" cy="232" r="7" /><circle cx="166" cy="228" r="8" /><circle cx="180" cy="232" r="7" />
      <circle cx="140" cy="215" r="7" /><circle cx="158" cy="215" r="8" /><circle cx="174" cy="216" r="7" />
      <circle cx="226" cy="250" r="9" /><circle cx="244" cy="246" r="7" /><circle cx="262" cy="248" r="8" /><circle cx="280" cy="245" r="7" />
      <circle cx="220" cy="232" r="7" /><circle cx="234" cy="228" r="8" /><circle cx="252" cy="232" r="7" /><circle cx="270" cy="230" r="8" />
      <circle cx="226" cy="216" r="7" /><circle cx="242" cy="215" r="8" /><circle cx="260" cy="215" r="7" />
    </g>

    <!-- Center Staircase -->
    <rect x="180" y="200" width="40" height="65" fill="#ffffff" stroke="#18181b" stroke-width="4" />
    <line x1="180" y1="215" x2="220" y2="215" stroke="#18181b" stroke-width="3" />
    <line x1="180" y1="230" x2="220" y2="230" stroke="#18181b" stroke-width="3" />
    <line x1="180" y1="245" x2="220" y2="245" stroke="#18181b" stroke-width="3" />

    <!-- Lingga Pillar & Dome -->
    <!-- Balustrade Pillars -->
    <rect x="125" y="170" width="60" height="30" fill="#ffffff" stroke="#18181b" stroke-width="3" />
    <line x1="140" y1="170" x2="140" y2="200" stroke="#18181b" stroke-width="2" />
    <line x1="155" y1="170" x2="155" y2="200" stroke="#18181b" stroke-width="2" />
    <line x1="170" y1="170" x2="170" y2="200" stroke="#18181b" stroke-width="2" />

    <rect x="215" y="170" width="60" height="30" fill="#ffffff" stroke="#18181b" stroke-width="3" />
    <line x1="230" y1="170" x2="230" y2="200" stroke="#18181b" stroke-width="2" />
    <line x1="245" y1="170" x2="245" y2="200" stroke="#18181b" stroke-width="2" />
    <line x1="260" y1="170" x2="260" y2="200" stroke="#18181b" stroke-width="2" />

    <!-- Main Monument Body -->
    <path d="M 155 170 L 165 125 L 235 125 L 245 170 Z" fill="#ffffff" stroke="#18181b" stroke-width="4" />
    <rect x="180" y="135" width="40" height="20" fill="#f1f5f9" stroke="#18181b" stroke-width="2" />
    
    <!-- Lingga Dome Tier -->
    <rect x="170" y="115" width="60" height="10" fill="#ffffff" stroke="#18181b" stroke-width="3" rx="2" />
    <!-- Dome Top -->
    <path d="M 178 115 C 178 85 222 85 222 115 Z" fill="#ffffff" stroke="#18181b" stroke-width="4" />
  </g>

  <!-- Bottom Yellow Ribbon with Red Outline: "INSUN MEDAL" -->
  <g id="ribbon">
    <!-- Ribbon Tail Left -->
    <polygon points="10,430 65,430 45,465 10,465 30,447" fill="#d9251d" />
    <polygon points="15,433 60,433 42,460 15,460 30,447" fill="#facc15" />
    <!-- Ribbon Tail Right -->
    <polygon points="390,430 335,430 355,465 390,465 370,447" fill="#d9251d" />
    <polygon points="385,433 340,433 358,460 385,460 370,447" fill="#facc15" />

    <!-- Center Main Banner -->
    <rect x="50" y="420" width="300" height="48" fill="#d9251d" rx="4" />
    <rect x="54" y="424" width="292" height="40" fill="#facc15" rx="3" />

    <!-- "Insun Medal" text in Sundanese stylized lettering -->
    <text x="200" y="454" font-family="'JetBrains Mono', 'Courier New', monospace, serif" font-weight="900" font-size="28" fill="#09090b" text-anchor="middle" letter-spacing="4">
      INSUN MEDAL
    </text>
  </g>
</svg>
